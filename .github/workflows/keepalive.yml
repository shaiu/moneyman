name: Keepalive

# GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity. Once YNAB is gone this repo can go quiet that
# long, and the scrapes would stop with no failed run to report it. A monthly
# empty commit is unambiguous activity. Requires main to stay unprotected.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Push an empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive [skip ci]"
          git push
