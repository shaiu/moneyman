name: Scrape_Max

on:
  workflow_dispatch:
    inputs:
      containerTag:
        default: "latest"
        required: false
        description: "Container tag to use (e.g., 'latest', 'pr-123' for PR #123)"
      sendNewConfigToTg:
        description: "Send current config as config.txt via Telegram (true/false)"
        type: boolean
        required: false
        default: false
      DEBUG:
        description: "Debug logging namespace (e.g., 'moneyman:*')"
        required: false
        default: "moneyman:*"
  schedule:
    - cron: "5 07,19 * * *"
env:
  REGISTRY: ghcr.io
jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      - id: normalize-repository-name
        run: echo "repository=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - id: set-container-image
        run: echo "image=${{ env.REGISTRY }}/${{ steps.normalize-repository-name.outputs.repository }}:${{ github.event.inputs.containerTag || 'latest' }}" >> $GITHUB_OUTPUT

      # Skipped until the tailnet secrets exist, so scraping keeps working
      # before the Actual migration's Phase 0 is done.
      - name: Connect to tailnet
        if: env.TS_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Actual runs as a Home Assistant add-on. HA's Tailscale add-on uses
          # userspace networking, which accepts connections to its tailnet IP
          # but never delivers them to the add-on's port. So the HA box
          # advertises Actual's LAN address as a subnet route instead, and
          # serverUrl points at that LAN address.
          args: --accept-routes

      - name: Pull container image
        run: docker pull ${{ steps.set-container-image.outputs.image }}

      - name: Run scraper
        run: >
          docker run --rm
          --network host
          -e MONEYMAN_CONFIG
          -e MONEYMAN_BROWSER_COOKIES
          -e DEBUG
          -e TZ
          -e SEND_NEW_CONFIG_TO_TG
          ${{ steps.set-container-image.outputs.image }}
        env:
          MONEYMAN_CONFIG: ${{ secrets.MONEYMAN_CONFIG_MAX }}
          MONEYMAN_BROWSER_COOKIES: ${{ secrets.MONEYMAN_BROWSER_COOKIES }}
          DEBUG: ${{ github.event.inputs.DEBUG || '' }}
          TZ: "Asia/Jerusalem"
          SEND_NEW_CONFIG_TO_TG: ${{ github.event.inputs.sendNewConfigToTg }}
