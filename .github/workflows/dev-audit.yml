# Detects a dev-agent commit that reached main WITHOUT a merged PR (ausie
# spec 2026-10-26-dev-lane-design.md §5). This repo is private on a free plan,
# so GitHub offers no branch protection; the dev agent's guard hook and its
# scripts (which only write dev/* branches) are the prevention, and this is the
# detection. A merged dev PR is not an alarm: every commit is checked against
# the PRs GitHub associates with it. Copied from eazy-moments' ci-fixer-audit.yml.
#
# The dev agent's token has Workflows: none, so it cannot edit this file. On
# eazy-moments it is also excluded from the ci-fixer (ausie
# mcp/src/cifix/repos.json, which mirrors this name in unownedWorkflowNames).
name: dev audit

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Check this one commit (for testing the alert)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every dev commit came through a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHAS: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || join(github.event.commits.*.id, ' ') }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          bad=""
          for sha in $SHAS; do
            author=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.author.email')
            [ "$author" = "dev@users.noreply.shaiungar.me" ] || continue
            merged=$(gh api "repos/$REPO/commits/$sha/pulls" --jq '[.[] | select(.merged_at != null)] | length')
            [ "$merged" -gt 0 ] || bad="$bad $sha"
          done
          if [ -z "$bad" ]; then echo "no direct dev pushes"; exit 0; fi
          msg="🚨 dev pushed to $REPO main without a PR:$bad — https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID"
          echo "::error::$msg"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$msg" > /dev/null
          else
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are not set; this alert reached only the Actions tab"
          fi
          exit 1
