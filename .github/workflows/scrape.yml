name: Scrape_Hapoalim

on:
  workflow_dispatch:
    inputs:
      containerTag:
        default: "latest"
        required: false
        description: "Container tag to use (e.g., 'latest', 'pr-123' for PR #123)"
      sendNewConfigToTg:
        description: "Send current config as config.txt via Telegram (true/false)"
        type: boolean
        required: false
        default: false
      DEBUG:
        description: "Debug logging namespace (e.g., 'moneyman:*')"
        required: false
        default: "moneyman:*"
      # The drill only proves anything if the run has transactions to write:
      # with none, the save is skipped and Actual is never contacted. Run it on
      # a workflow whose last run scraped transactions.
      simulateActualOutage:
        description: "Alert drill: skip the tailnet step so the Actual write fails"
        type: boolean
        required: false
        default: false
  schedule:
    # In Israel: [12:05, 00:05] or [13:05, 01:05] on DST
    - cron: "5 10,22 * * *"
env:
  REGISTRY: ghcr.io
jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      - id: normalize-repository-name
        run: echo "repository=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - id: set-container-image
        run: echo "image=${{ env.REGISTRY }}/${{ steps.normalize-repository-name.outputs.repository }}:${{ github.event.inputs.containerTag || 'latest' }}" >> $GITHUB_OUTPUT

      # Skipped until the tailnet secrets exist, so scraping keeps working
      # before the Actual migration's Phase 0 is done.
      - name: Connect to tailnet
        if: env.TS_OAUTH_CLIENT_ID != '' && github.event.inputs.simulateActualOutage != 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Pull container image
        run: docker pull ${{ steps.set-container-image.outputs.image }}

      - name: Run scraper
        run: >
          docker run --rm
          --network host
          -e MONEYMAN_CONFIG
          -e MONEYMAN_BROWSER_COOKIES
          -e DEBUG
          -e TZ
          -e SEND_NEW_CONFIG_TO_TG
          -e MONEYMAN_FAIL_ON_ERROR
          -e MONEYMAN_GITHUB_ANNOTATIONS
          ${{ steps.set-container-image.outputs.image }}
        env:
          MONEYMAN_CONFIG: ${{ secrets.MONEYMAN_CONFIG }}
          MONEYMAN_BROWSER_COOKIES: ${{ secrets.MONEYMAN_BROWSER_COOKIES }}
          DEBUG: ${{ github.event.inputs.DEBUG || '' }}
          TZ: "Asia/Jerusalem"
          SEND_NEW_CONFIG_TO_TG: ${{ github.event.inputs.sendNewConfigToTg }}
          MONEYMAN_FAIL_ON_ERROR: "true"
          MONEYMAN_GITHUB_ANNOTATIONS: "true"
